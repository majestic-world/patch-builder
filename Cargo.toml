[package]
name = "patch-builder"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
futures-channel = { version = "0.3", default-features = false, features = ["std", "alloc"] }
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = { version = "1.18.1", features = ["unstable-winit-030"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
tempfile = "3.27.0"

# Speed over binary size and build time. No `target-cpu=native`: BLAKE3 and zlib-rs already
# pick SIMD at runtime, and the binary must still run on other publishers' machines.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
debug = false
