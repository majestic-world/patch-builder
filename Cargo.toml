[package]
name = "patch-builder"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
dirs = "7.0.0"
futures-channel = { version = "0.3", default-features = false, features = ["std", "alloc"] }
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = { version = "1.18.1", features = ["unstable-winit-030"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
# Renders ui/icons/app-icon.svg into the .exe icon; the SVG only uses shapes and gradients.
resvg = { version = "0.48", default-features = false }
slint-build = "1.18.1"
winresource = { version = "0.1.31", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

# Parallel codegen without cross-crate LTO. Measured on a 2 GB Source, fat LTO with one codegen
# unit scanned and zipped no faster, but took 78 s instead of 10 s to rebuild after an edit: the
# hot loops live inside BLAKE3 and zlib-rs, which gain nothing from inlining across crates.
# No `target-cpu=native`: both crates pick SIMD at runtime, and the binary must still run on
# other publishers' machines.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
